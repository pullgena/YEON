name: KeyView Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'keyview/**'
      - '.github/workflows/keyview-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r keyview/requirements.txt
          python -m pip install pyinstaller
      - name: Verify keyboard mapping
        run: python -m unittest discover -s keyview/tests -p "test_*.py"
      - name: Build portable Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name YEON-KeyView --paths keyview keyview/app.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: YEON-KeyView-Windows
          path: dist/YEON-KeyView.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish separate KeyView release
        if: github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyview-v1.0.${{ github.run_number }}
          name: YEON KeyView v1.0.${{ github.run_number }}
          files: dist/YEON-KeyView.exe
          make_latest: false
          body: |
            Windows portable EXE for YEON KeyView.
            Displays physical keyboard presses in an on-screen keyboard.
