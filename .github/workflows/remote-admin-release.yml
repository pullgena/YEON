name: YEON Remote Administrator Windows Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'remote-admin/**'
      - '.github/workflows/remote-admin-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-admin:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: remote-admin
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron build dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Test controller address and access restrictions
        shell: pwsh
        run: npm test
      - name: Build administrator Windows EXE
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build:win
          if (!(Test-Path 'dist/YEON-Remote-Admin-v1.3.0.exe')) { throw 'Admin EXE missing' }
      - name: Upload administrator EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: YEON-Remote-Admin-v1.3.0-Windows
          path: remote-admin/dist/YEON-Remote-Admin-v1.3.0.exe
          if-no-files-found: error
      - name: Publish separate administrator release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: remote-admin-v1.3.0
          name: YEON 원격 조정 - 관리자 v1.3.0 (Windows)
          target_commitish: ${{ github.sha }}
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            YEON 원격 조정 관리자용 앱 v1.3.0입니다.
            관리자 Windows PC에서 이 EXE를 실행하면 전용 관리자 제어판이 바로 열립니다.
            관리 대상 PC에서 별도 공유 앱(remote-v1.0.1)을 실행해 공유 시작 후 표시되는
            사설 IP와 8자리 인증 코드를 사용해 접속합니다.
            같은 LAN에서만 작동하며 관리 대상의 명시적인 공유 시작이 필요합니다.
          files: remote-admin/dist/YEON-Remote-Admin-v1.3.0.exe
