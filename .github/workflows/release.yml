name: Windows EXE release
on:
  push:
    branches: [main]
    paths:
      - 'electron-main.js'
      - 'server.js'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installers
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --title "YEON $tag - Windows" --notes "Windows 설치형/포터블 EXE 앱. 프로토타입으로 로컬 채팅 서버를 실행합니다. 다중 사용자 인터넷 채팅에는 공유 서버가 필요합니다."
          }
          gh release upload $tag "dist/*.exe" --clobber
