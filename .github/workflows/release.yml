name: Build Windows EXE
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build EXE
        shell: pwsh
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YEON-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
      - name: Create release and attach EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "YEON $tag Windows" --notes "YEON Windows 64-bit installer and portable EXE."
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release' }
          }
          $exeFiles = Get-ChildItem dist -Filter *.exe
          if ($exeFiles.Count -eq 0) { throw 'No EXE was built' }
          foreach ($exe in $exeFiles) {
            gh release upload $tag $exe.FullName --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($exe.Name)" }
          }
