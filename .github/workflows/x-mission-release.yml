name: Build X Mission Windows EXE and Release
on:
  push:
    branches: [main]
    paths:
      - 'x-mission/**'
      - '.github/workflows/x-mission-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: x-mission
        run: npm install --no-audit --no-fund
      - name: Build portable Windows EXE
        working-directory: x-mission
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'x-mission-v1.1.0'
          $asset = Get-ChildItem 'x-mission/dist/*.exe' | Select-Object -First 1
          if (-not $asset) { throw 'EXE output missing' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber
          } else {
            gh release create $tag $asset.FullName --title 'YEON X Mission v1.1.0' --notes 'Windows portable EXE. Chrome-style X button mission app.' --target $env:GITHUB_SHA
          }
