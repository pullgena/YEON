name: Blade Dimensions Windows Release

on:
  push:
    branches: [main]
    paths:
      - "blade-dimensions/release-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: blade-dimensions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run dist:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blade-dimensions-v0.2.2
          name: Blade Dimensions v0.2.2
          body: |
            Blade Dimensions Windows 앱 v0.2.2입니다.

            - 인터넷은 연결되어 있지만 느리거나 불안정하면 상단 경고 표시
            - 🌐 + 낮은 신호 막대 + "와이파이가 안좋습니다."
            - 현재 측정 지연시간(ms) 표시
            - 2회 연속 상태가 나쁠 때 경고 표시
            - 2회 연속 상태가 좋아지면 자동 해제
            - 완전 오프라인이면 기존 "와이파이가 없어요" 검은 화면 우선
          files: |
            blade-dimensions/dist/*.exe
          fail_on_unmatched_files: true
          make_latest: true
