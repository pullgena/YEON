name: Blade Dimensions Windows Release

on:
  push:
    branches: [main]
    paths:
      - "blade-dimensions/release-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: blade-dimensions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run dist:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blade-dimensions-v0.2.4
          name: Blade Dimensions v0.2.4
          body: |
            Blade Dimensions Windows 앱 v0.2.4입니다.

            - 설정에 큰 Wi-Fi 아이콘 테스트 패널 추가
            - 전파 세기 0~4단계 직접 조절
            - 2칸/1칸에서 상단 "와이파이가 안좋습니다." 경고
            - 0칸에서 기존 "와이파이가 없어요" 오프라인 화면
            - 테스트 중 실제 네트워크 상태가 테스트를 덮어쓰지 않음
            - "실제 상태로 돌아가기" 버튼으로 복귀
          files: |
            blade-dimensions/dist/*.exe
          fail_on_unmatched_files: true
          make_latest: true
