name: Blade Dimensions Windows Release

on:
  push:
    branches: [main]
    paths:
      - "blade-dimensions/release-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: blade-dimensions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run dist:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blade-dimensions-v0.2.1
          name: Blade Dimensions v0.2.1
          body: |
            Blade Dimensions Windows 앱 v0.2.1입니다.

            - 인터넷 연결이 끊기면 검은 오프라인 화면 표시
            - 🌐 아이콘 + X 표시
            - "와이파이가 없어요" 안내
            - "와이파이 설정하러 가기" 버튼
            - Windows 빠른 설정(Win+A)을 열고 Wi-Fi 관리 항목 자동 진입 시도
            - 자동 진입 실패 시 Windows Wi-Fi 설정 페이지로 이동
            - 연결 복구 시 게임 화면 자동 복귀
          files: |
            blade-dimensions/dist/*.exe
          fail_on_unmatched_files: true
          make_latest: true
