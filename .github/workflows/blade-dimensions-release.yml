name: Blade Dimensions Windows Release

on:
  push:
    branches: [main]
    paths:
      - "blade-dimensions/release-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: blade-dimensions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run dist:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blade-dimensions-v0.2.3
          name: Blade Dimensions v0.2.3
          body: |
            Blade Dimensions Windows 앱 v0.2.3입니다.

            - 게임 설정 화면에 📶 Wi-Fi 설정 항목 추가
            - Wi-Fi 설정 열기 버튼으로 Windows 빠른 설정 바로 열기
            - Wi-Fi 관리 항목 자동 진입 시도
            - 자동 진입 실패 시 Windows Wi-Fi 설정 페이지 직접 열기
            - 게임을 종료하지 않고 Wi-Fi 연결 상태 테스트 가능
            - 기존 오프라인/약한 Wi-Fi 경고 기능 포함
          files: |
            blade-dimensions/dist/*.exe
          fail_on_unmatched_files: true
          make_latest: true
