<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YEON | 함께 연결되는 공간</title>
<style>
:root{font-family:Inter,system-ui,"Malgun Gothic",sans-serif;color:#edf0fa;background:#171820;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #a5a5ff;outline-offset:2px}.app{display:grid;grid-template-columns:76px 244px minmax(0,1fr) 220px;height:100dvh;min-height:480px}.guilds{background:#15151d;display:flex;flex-direction:column;align-items:center;gap:13px;padding:22px 10px}.logo,.guild{border:0;color:white;background:#353545;width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:23px;font-weight:800;transition:.15s}.logo{background:#7672f5}.guild.active,.guild:hover{background:#7774f9;border-radius:16px}.guild.add{color:#66d6b1;background:#293c3b;font-size:30px}.divider{width:32px;height:2px;background:#393a47}.sidebar{background:#20212c;display:flex;flex-direction:column;min-width:0}.server-head{padding:23px 18px;border-bottom:1px solid #151620;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section-title{padding:24px 18px 9px;color:#9496ac;display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.07em}.section-title button{border:0;background:none;color:#a6a6bb;font-size:22px}.channel{margin:2px 9px;width:calc(100% - 18px);border:0;text-align:left;padding:11px 13px;color:#a5a7b9;background:transparent;border-radius:9px}.channel:hover,.channel.active{color:white;background:#363746}.hash{color:#818397;font-size:20px;margin-right:10px}.profile{margin-top:auto;background:#191a24;padding:13px;display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:12px;background:#6e69e6;display:grid;place-items:center;font-weight:800;flex:none}.profile small{display:block;color:#8588a1}.main{display:flex;flex-direction:column;min-width:0;background:#292a37}.top{height:72px;min-height:72px;border-bottom:1px solid #21222e;display:flex;align-items:center;padding:0 25px;gap:10px;font-weight:800;box-shadow:0 2px 8px #15151c22}.top span{font-size:26px;color:#9294a9}.welcome{margin:auto 0 10px;padding:15px 32px}.big-hash{display:grid;place-items:center;width:68px;height:68px;background:#404156;color:#b5b2ff;border-radius:22px;font-size:40px}.welcome h1{font-size:26px;margin-bottom:4px}.welcome p{color:#a2a4b7}.messages{overflow:auto;flex:1;padding:8px 20px 20px;min-height:0}.msg{display:flex;gap:14px;padding:11px 12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.msg:hover{background:#ffffff08}.msg .avatar{width:40px;height:40px}.meta{display:flex;gap:10px;align-items:baseline}.meta strong{font-size:14px}.meta time{font-size:11px;color:#8d90a5}.msg p{margin:5px 0;font-size:14px;line-height:1.6}.composer{margin:0 24px 25px;background:#393b4c;display:flex;align-items:flex-end;border-radius:12px;padding:11px 13px;gap:10px}.composer textarea{background:transparent;border:0;resize:none;flex:1;color:white;min-height:26px;max-height:130px;outline:none}.composer button,.primary{border:0;border-radius:9px;background:#7975f5;color:white;padding:9px 15px;font-weight:700}.members{background:#23242f;padding:25px 18px}.members h3{font-size:12px;color:#a1a2b8;text-transform:uppercase;letter-spacing:.06em}.member{display:flex;gap:10px;align-items:center;padding:10px 0;font-size:14px}.member .avatar{width:31px;height:31px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#56d6a2;margin-left:auto}.muted{color:#9b9db3;font-size:13px}.empty{text-align:center;color:#989ab2;padding:24px}dialog{border:1px solid #515367;border-radius:18px;background:#282936;color:white;padding:28px;width:min(420px,90vw)}dialog::backdrop{background:#090912b5}dialog h2{margin:0 0 7px}dialog p{color:#a4a6bd;font-size:14px}dialog input{width:100%;border:1px solid #505166;background:#1b1c28;border-radius:9px;padding:13px;color:white;margin:14px 0 18px}dialog menu{display:flex;gap:10px;justify-content:flex-end;padding:0;margin:0}dialog menu button{padding:10px 18px;border-radius:9px;border:0;background:#46485a;color:white}#connection{margin-left:auto;font-size:12px;color:#80dfbc;font-weight:500}@media(max-width:1050px){.app{grid-template-columns:68px 220px minmax(0,1fr)}.members{display:none}}@media(max-width:630px){.app{grid-template-columns:58px 116px minmax(0,1fr)}.guilds{padding:15px 4px}.guild,.logo{width:44px;height:44px}.server-head{padding:19px 10px;font-size:13px}.section-title{padding:22px 8px 8px;font-size:10px}.channel{margin:2px 4px;width:calc(100% - 8px);padding:9px 5px;font-size:12px}.hash{font-size:14px;margin-right:2px}.profile{padding:6px}.profile .avatar{display:none}.profile strong{font-size:11px}.top{padding:0 12px}.messages{padding:4px}.welcome{padding:12px}.welcome h1{font-size:20px}.composer{margin:0 8px 12px;padding:8px}.composer button{padding:8px}}
</style></head><body>
<div class="app"><nav class="guilds" aria-label="서버"><div class="logo" title="YEON">✦</div><div class="divider"></div><div id="guilds"></div><button class="guild add" title="서버 추가" id="addServer">+</button></nav><aside class="sidebar"><header class="server-head" id="serverName">YEON</header><div class="section-title">텍스트 채널 <button title="채널 추가" id="addChannel">+</button></div><div id="channels"></div><div class="profile"><div class="avatar" id="myAvatar">Y</div><div><strong id="myName">사용자</strong><small>● 온라인</small></div></div></aside><main class="main"><header class="top"><span>#</span><b id="channelTitle">일반</b><span id="connection">연결 중…</span></header><div class="messages" id="messages" aria-live="polite"></div><form class="composer" id="form"><textarea id="text" rows="1" maxlength="2000" placeholder="메시지 보내기 (Enter)" aria-label="메시지"></textarea><button type="submit" aria-label="전송">➤</button></form></main><aside class="members"><h3 id="memberHeading">온라인 — 0</h3><div id="memberList"></div></aside></div>
<dialog id="promptDialog"><form method="dialog" id="promptForm"><h2 id="promptTitle"></h2><p id="promptDesc"></p><input id="promptInput" maxlength="36" required autocomplete="off"><menu><button type="button" id="cancel">취소</button><button class="primary" type="submit">확인</button></menu></form></dialog>
<script>
const $=id=>document.getElementById(id);
let state={servers:[],messages:[],online:[]},sid='lounge',cid='general';
const uid=sessionStorage.getItem('yeon-id')||crypto.randomUUID();sessionStorage.setItem('yeon-id',uid);
let nickname=localStorage.getItem('yeon-name')||'';
let promptResolve;
function ask(title,desc,value=''){return new Promise(resolve=>{promptResolve=resolve;$('promptTitle').textContent=title;$('promptDesc').textContent=desc;$('promptInput').value=value;$('promptDialog').showModal();setTimeout(()=>$('promptInput').focus(),20)})}
$('promptForm').addEventListener('submit',e=>{e.preventDefault();$('promptDialog').close();promptResolve?.($('promptInput').value.trim());promptResolve=null});
$('cancel').onclick=()=>{$('promptDialog').close();promptResolve?.(null);promptResolve=null};
$('promptDialog').addEventListener('close',()=>{if(promptResolve){promptResolve(null);promptResolve=null}});
async function api(url,body){const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const json=await response.json();if(!response.ok)throw Error(json.error||'요청 실패');return json}
function el(tag,cls,text){let x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function activeServer(){return state.servers.find(s=>s.id===sid)||state.servers[0]}
function render(){
 const server=activeServer();if(!server)return;sid=server.id;
 if(!server.channels.some(c=>c.id===cid))cid=server.channels[0]?.id;
 $('serverName').textContent=server.name;
 $('guilds').replaceChildren();state.servers.forEach(s=>{const b=el('button','guild'+(sid===s.id?' active':''),s.icon);b.title=s.name;b.onclick=()=>{sid=s.id;cid=s.channels[0]?.id;render()};$('guilds').append(b)});
 $('channels').replaceChildren();server.channels.forEach(c=>{const b=el('button','channel'+(c.id===cid?' active':''));b.append(el('span','hash','#'),document.createTextNode(c.name));b.onclick=()=>{cid=c.id;render()};$('channels').append(b)});
 const channel=server.channels.find(c=>c.id===cid);$('channelTitle').textContent=channel?.name||'채널';
 const messages=$('messages');messages.replaceChildren();
 const welcome=el('div','welcome');welcome.append(el('div','big-hash','#'),el('h1','',channel?.name+' 채널에 오신 것을 환영합니다!'),el('p','','대화를 시작해 보세요. 이 채널의 첫 메시지를 남겨 보세요.'));messages.append(welcome);
 const matches=state.messages.filter(m=>m.serverId===sid&&m.channelId===cid);
 for(const m of matches){const wrap=el('div','msg'),av=el('div','avatar',m.author.slice(0,1).toUpperCase()),detail=el('div'),meta=el('div','meta'),t=el('time','',new Date(m.time).toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}));meta.append(el('strong','',m.author),t);detail.append(meta,el('p','',m.text));wrap.append(av,detail);messages.append(wrap)}
 messages.scrollTop=messages.scrollHeight;
 $('memberHeading').textContent='온라인 — '+state.online.length;$('memberList').replaceChildren();
 for(const u of state.online){const m=el('div','member');m.append(el('div','avatar',u.name[0]?.toUpperCase()||'?'),el('span','',u.name),el('i','dot'));$('memberList').append(m)}
 $('myAvatar').textContent=nickname.slice(0,1).toUpperCase();$('myName').textContent=nickname;
}
async function presence(leave=false){try{await api('/api/presence',{id:uid,name:nickname,leave})}catch{}}
$('addServer').onclick=async()=>{const name=await ask('서버 만들기','새로운 커뮤니티의 이름을 입력하세요.');if(!name)return;try{const s=await api('/api/server',{name});sid=s.id;cid=s.channels[0].id;await refresh()}catch(e){alert(e.message)}};
$('addChannel').onclick=async()=>{const name=await ask('텍스트 채널 만들기','새 채널 이름을 입력하세요.');if(!name)return;try{const c=await api('/api/channel',{serverId:sid,name});cid=c.id;await refresh()}catch(e){alert(e.message)}};
$('form').onsubmit=async e=>{e.preventDefault();const input=$('text'),text=input.value.trim();if(!text)return;input.value='';try{await api('/api/message',{serverId:sid,channelId:cid,author:nickname,text})}catch(err){input.value=text;alert(err.message)}};
$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};
async function refresh(){try{state=await(await fetch('/api/state')).json();render()}catch{$('connection').textContent='서버 연결 실패'} }
async function boot(){
 if(!nickname){nickname=await ask('YEON에 오신 것을 환영합니다!','채팅에서 사용할 닉네임을 정해 주세요.');if(!nickname)nickname='게스트-'+uid.slice(0,4);localStorage.setItem('yeon-name',nickname)}
 await refresh();await presence();
 const events=new EventSource('/api/events');
 events.onopen=()=>{$('connection').textContent='● 실시간 연결됨'};
 events.onerror=()=>{$('connection').textContent='재연결 중…'};
 events.addEventListener('message',e=>{const m=JSON.parse(e.data);if(!state.messages.some(x=>x.id===m.id)){state.messages.push(m);render()}});
 events.addEventListener('state',e=>{const s=JSON.parse(e.data);state.servers=s.servers;state.messages=s.messages;state.online=s.online;render()});
 events.addEventListener('online',e=>{state.online=JSON.parse(e.data);render()});
 setInterval(()=>presence(),20000);
}
boot();
</script></body></html>
