<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YEON — 커뮤니티</title>
<style>
:root{font-family:Inter,"Segoe UI","Malgun Gothic",sans-serif;color:#f2f3f5;background:#202127;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #b4b4fc;outline-offset:2px}button{border:0;color:inherit}button:disabled{opacity:.5;cursor:not-allowed}
#app{height:100dvh;min-height:550px;display:grid;grid-template-columns:72px 244px minmax(340px,1fr) 232px;overflow:hidden}.rail{background:#121318;display:flex;align-items:center;flex-direction:column;gap:10px;padding:16px 10px;overflow:auto}.rail-btn{width:48px;height:48px;min-height:48px;border-radius:18px;background:#333540;display:grid;place-items:center;font-size:20px;font-weight:800;position:relative;transition:.16s}.rail-btn:hover,.rail-btn.on{border-radius:15px;background:#5865f2}.rail-btn.on:before{content:"";position:absolute;left:-13px;top:10px;width:4px;height:28px;border-radius:4px;background:white}.rail-btn.plus{color:#4adb9f;background:#24362d}.rail-btn.plus:hover{background:#278955;color:white}.sep{width:32px;height:2px;background:#3a3c46;margin:3px}
.sidebar{background:#202127;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #1b1c22}.server-title{height:56px;min-height:56px;padding:0 17px;border-bottom:1px solid #15161b;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px}.side-scroll{overflow-y:auto;flex:1}.sub-title{display:flex;justify-content:space-between;align-items:center;color:#969ba7;font-size:11px;font-weight:800;letter-spacing:.06em;padding:23px 13px 7px}.sub-title button{background:none;color:#9a9ca9;font-size:20px;line-height:1}.side-btn{display:flex;align-items:center;gap:11px;width:calc(100% - 16px);margin:2px 8px;padding:9px 12px;background:transparent;color:#969ba7;text-align:left;border-radius:6px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:14px}.side-btn:hover{color:#dedfe5;background:#32343d}.side-btn.on{color:white;background:#3b3d48}.side-btn .symbol{font-size:21px;font-weight:400;color:#858a98}.userbar{height:59px;min-height:59px;background:#18191e;display:flex;align-items:center;padding:8px;gap:8px}.avatar{width:36px;height:36px;border-radius:50%;background:#7060d4;display:grid;place-items:center;flex:none;font-weight:800;color:#fff;position:relative}.avatar .status{position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border:3px solid #18191e;background:#3ba55c;border-radius:50%}.userbar .who{flex:1;min-width:0;line-height:1.2}.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.who small{color:#b2b3ba;font-size:11px}.iconbtn{background:transparent;color:#b4b5c0;width:31px;height:31px;border-radius:6px;font-size:18px}.iconbtn:hover{background:#40424d;color:white}
.main{display:flex;flex-direction:column;background:#303138;min-width:0}.header{height:56px;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 19px;border-bottom:1px solid #26272e;box-shadow:0 1px 3px #1114}.header .hash{color:#9094a2;font-size:25px}.header b{font-size:15px}.header .description{font-size:12px;color:#9b9ca7;border-left:1px solid #494b57;padding-left:14px;margin-left:5px}.header .spacer{flex:1}.header .quick{background:transparent;color:#b3b5c2;padding:5px 8px;font-size:18px}.header .quick:hover{color:#fff}.search{width:150px;min-width:70px;background:#1e1f25;border:1px solid #24252c;color:#ececf2;border-radius:5px;padding:6px 10px;font-size:12px}
.timeline{flex:1;overflow:auto;display:flex;flex-direction:column;padding:16px 0 4px}.welcome{margin-top:auto;padding:30px 24px 22px}.welcome .round{background:#41424d;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:34px;color:#d1d3da}.welcome h2{font-size:27px;margin:17px 0 5px}.welcome p{color:#aeb0bc;margin:0;font-size:14px}.divider{height:1px;background:#4c4d58;margin:0 20px 10px}.message{display:flex;align-items:flex-start;gap:15px;padding:9px 21px;overflow-wrap:anywhere}.message:hover{background:#2a2b32}.message .avatar{width:40px;height:40px}.message .body{min-width:0}.message .name{font-size:14px;font-weight:800}.message time{color:#9598a6;font-size:11px;margin-left:9px}.message p{margin:5px 0 0;line-height:1.55;font-size:14px;white-space:pre-wrap}.no-msg{color:#a1a2ad;padding:15px 24px;font-size:13px}.composer-area{padding:10px 17px 23px}.composer{display:flex;align-items:flex-end;background:#43444f;border-radius:9px;padding:10px;gap:9px}.composer textarea{border:0;outline:0;background:transparent;resize:none;color:#fff;flex:1;min-width:0;max-height:140px;font-size:14px;padding:6px 0}.composer button{border-radius:7px;background:#5865f2;padding:9px 14px;font-weight:800}.composer button:hover{background:#727df6}.hint{font-size:11px;color:#9899a7;margin:6px 2px 0}
.memberpane{background:#25262d;overflow:auto;padding:23px 12px}.memberpane h3{font-size:11px;color:#9295a3;letter-spacing:.07em;padding:0 7px}.member{display:flex;align-items:center;gap:11px;padding:9px 7px;font-size:14px;border-radius:5px}.member:hover{background:#363741}.member .avatar{width:32px;height:32px}.offline{color:#818391;font-size:12px;padding:7px}.banner{background:#212b39;color:#acdafb;padding:10px 17px;font-size:12px}.home{padding:25px;overflow:auto}.home h1{margin:0 0 10px;font-size:25px}.home p{color:#b5b6c3;line-height:1.65}.tile{background:#393a45;padding:18px;border-radius:11px;margin-top:14px}.tile b{display:block;margin-bottom:6px}.tile small{color:#b2b4c3}.tile button{background:#5865f2;padding:9px 14px;border-radius:7px;margin-top:12px}
dialog{background:#31323b;border:1px solid #50515d;color:white;border-radius:13px;width:min(440px,94vw);padding:25px}dialog::backdrop{background:#000b}dialog h2{margin:0 0 7px}dialog p{font-size:13px;color:#b6b8c5;line-height:1.6}dialog input{display:block;width:100%;border:1px solid #252630;border-radius:6px;background:#1e1f26;color:white;padding:12px;margin:15px 0}dialog menu{padding:0;margin:0;display:flex;justify-content:flex-end;gap:8px}dialog menu button{padding:10px 16px;border-radius:6px;background:#4b4d58}dialog menu button.primary{background:#5865f2}.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);border-radius:9px;background:#12131a;color:#fff;padding:13px 20px;box-shadow:0 8px 40px #0008;z-index:10;display:none}.connection{font-size:11px;color:#7dcf9b}
@media(max-width:1050px){#app{grid-template-columns:70px 230px minmax(0,1fr)}.memberpane{display:none}}@media(max-width:660px){#app{grid-template-columns:60px 148px minmax(0,1fr)}.rail{padding:12px 5px}.sidebar .server-title{padding:0 9px;font-size:12px}.side-btn{padding:8px 5px;font-size:12px}.sub-title{padding:17px 7px 6px}.userbar .iconbtn{display:none}.header{padding:0 10px}.header .description,.header .quick{display:none}.search{width:92px}.message{padding:8px 10px;gap:8px}.composer-area{padding:7px 8px}.welcome{padding:15px}.welcome h2{font-size:20px}}
</style></head><body>
<div id="app"><nav class="rail" aria-label="서버 목록"><button class="rail-btn" id="homeButton" title="홈과 친구">✦</button><div class="sep"></div><div id="serverButtons" style="display:contents"></div><button class="rail-btn plus" id="createServer" title="서버 만들기">＋</button></nav>
<aside class="sidebar"><div class="server-title"><span id="serverLabel">YEON</span><button class="iconbtn" id="serverMenu" title="서버 정보">⌄</button></div><div class="side-scroll"><div id="homeNav" hidden><button class="side-btn" id="friendsButton"><span class="symbol">♟</span> 친구 / 홈</button><button class="side-btn" id="updatesButton"><span class="symbol">☰</span> 소식</button></div><div id="channelNav"><div class="sub-title"><span>⌄ 텍스트 채널</span><button id="createChannel" title="채널 추가">＋</button></div><div id="channels"></div><div class="sub-title"><span>⌄ 음성 채널</span></div><button class="side-btn" id="voicePlaceholder"><span class="symbol">◖))</span> 음성 대화 (준비 중)</button></div></div><div class="userbar"><div class="avatar" id="myAvatar">Y<i class="status"></i></div><div class="who"><b id="myNick">YEON</b><small>● 온라인</small></div><button class="iconbtn" title="프로필 변경" id="editProfile">⚙</button></div></aside>
<main class="main"><div class="header"><span class="hash" id="headerSymbol">#</span><b id="heading">일반</b><span class="description" id="headerDescription">YEON에 오신 것을 환영합니다</span><div class="spacer"></div><span class="connection" id="connection">연결 중</span><button class="quick" title="멤버 보기" id="membersButton">♟</button><input class="search" id="search" placeholder="메시지 검색" aria-label="메시지 검색"></div><div class="timeline" id="timeline" aria-live="polite"></div><div class="composer-area" id="composerArea"><form class="composer" id="messageForm"><textarea id="messageInput" rows="1" maxlength="2000" aria-label="메시지 입력" placeholder="메시지를 입력하세요"></textarea><button type="submit" title="메시지 보내기">➤</button></form><div class="hint">Enter 전송 · Shift + Enter 줄바꿈</div></div></main>
<aside class="memberpane" id="memberPane"><h3 id="onlineHeading">온라인 — 0</h3><div id="members"></div><h3>오프라인</h3><div class="offline">접속한 사용자가 표시됩니다.</div></aside></div>
<dialog id="modal"><form id="modalForm" method="dialog"><h2 id="modalTitle"></h2><p id="modalDescription"></p><input id="modalInput" required maxlength="36"><menu><button type="button" id="cancelModal">취소</button><button type="submit" class="primary">확인</button></menu></form></dialog><div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const clientId=sessionStorage.getItem('yeon-device-id')||crypto.randomUUID();sessionStorage.setItem('yeon-device-id',clientId);
let nick=localStorage.getItem('yeon-nickname')||'',data={servers:[],messages:[],online:[]},serverId='lounge',channelId='general',home=false,homeTab='friends',resolveModal=null,scrollAfterRender=true;
const make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function notice(message){const n=$('toast');n.textContent=message;n.style.display='block';clearTimeout(notice.timer);notice.timer=setTimeout(()=>n.style.display='none',3600)}
function ask(title,desc,value=''){return new Promise(resolve=>{resolveModal=resolve;$('modalTitle').textContent=title;$('modalDescription').textContent=desc;$('modalInput').value=value;$('modal').showModal();$('modalInput').focus()})}
$('modalForm').onsubmit=e=>{e.preventDefault();const v=$('modalInput').value.trim();$('modal').close();resolveModal?.(v);resolveModal=null};
$('cancelModal').onclick=()=>{$('modal').close();resolveModal?.(null);resolveModal=null};
$('modal').onclose=()=>{if(resolveModal){resolveModal(null);resolveModal=null}};
async function request(url,obj){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(obj)});const j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');return j}
const currentServer=()=>data.servers.find(s=>s.id===serverId)||data.servers[0];
function renderSidebar(){
 const host=$('serverButtons');host.replaceChildren();$('homeButton').classList.toggle('on',home);
 data.servers.forEach(s=>{const b=make('button','rail-btn'+(!home&&s.id===serverId?' on':''),s.icon||s.name[0]);b.title=s.name;b.onclick=()=>{home=false;serverId=s.id;channelId=s.channels[0]?.id;render()};host.append(b)});
 const s=currentServer();if(!s)return;serverId=s.id;$('serverLabel').textContent=home?'개인 메시지':s.name;
 $('homeNav').hidden=!home;$('channelNav').hidden=home;
 $('friendsButton').classList.toggle('on',home&&homeTab==='friends');$('updatesButton').classList.toggle('on',home&&homeTab==='updates');
 $('channels').replaceChildren();for(const c of s.channels){const b=make('button','side-btn'+(!home&&channelId===c.id?' on':''));b.append(make('span','symbol','#'),document.createTextNode(c.name));b.onclick=()=>{channelId=c.id;home=false;render()};$('channels').append(b)}
 $('myNick').textContent=nick;$('myAvatar').firstChild.textContent=nick.slice(0,1).toUpperCase();
}
function renderMembers(){
 $('onlineHeading').textContent='온라인 — '+data.online.length;
 $('members').replaceChildren();
 for(const u of data.online){const m=make('div','member'),av=make('span','avatar',u.name.slice(0,1).toUpperCase());m.append(av,make('span','',u.name));$('members').append(m)}
}
function renderTimeline(){
 const s=currentServer();if(!s)return;
 if(!s.channels.some(c=>c.id===channelId))channelId=s.channels[0]?.id;
 const c=s.channels.find(c=>c.id===channelId),area=$('timeline');area.replaceChildren();
 $('heading').textContent=home?(homeTab==='friends'?'친구':'YEON 소식'):(c?.name||'일반');$('headerSymbol').textContent=home?'✦':'#';
 $('headerDescription').textContent=home?'함께 이야기하는 커뮤니티':'대화를 나누고 추억을 만들어 보세요';
 $('composerArea').style.display=home?'none':'block';$('search').style.display=home?'none':'block';
 if(home){const wrap=make('div','home');wrap.append(make('h1','',homeTab==='friends'?'친구와 대화하기':'YEON 소식'),make('p','',homeTab==='friends'?'YEON의 개인 공간입니다. 현재 버전은 서버별 공개 텍스트 채팅을 지원하며 친구 요청과 1:1 DM은 다음 업데이트에서 제공할 예정입니다.':'YEON 데스크톱 v0.3.0 · 디스코드 스타일의 서버, 채널, 채팅 화면으로 새로 구성했습니다.'));const tile=make('div','tile');tile.append(make('b','','서버 채팅 시작하기'),make('small','','왼쪽의 서버 아이콘을 선택해 채널에 참여해 보세요.'));const b=make('button','','YEON 라운지 열기');b.onclick=()=>{home=false;serverId=data.servers[0].id;channelId=data.servers[0].channels[0].id;render()};tile.append(b);wrap.append(tile);area.append(wrap);return}
 const welcome=make('div','welcome');welcome.append(make('div','round','#'),make('h2','', '# '+c?.name+' 채널에 오신 것을 환영합니다!'),make('p','','이곳은 #'+c?.name+' 채널의 시작입니다. 모두에게 인사해 보세요.'));area.append(welcome,make('div','divider'));
 const query=$('search').value.trim().toLocaleLowerCase();const msgs=data.messages.filter(m=>m.serverId===serverId&&m.channelId===channelId&&(!query||m.text.toLocaleLowerCase().includes(query)||m.author.toLocaleLowerCase().includes(query)));
 if(!msgs.length)area.append(make('div','no-msg',query?'검색 결과가 없습니다.':'아직 메시지가 없습니다. 첫 메시지를 보내 보세요.'));
 for(const m of msgs){const row=make('div','message'),avatar=make('span','avatar',m.author.slice(0,1).toUpperCase()),body=make('div','body'),meta=make('div');meta.append(make('span','name',m.author),make('time','',new Date(m.time).toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})));body.append(meta,make('p','',m.text));row.append(avatar,body);area.append(row)}
 if(scrollAfterRender)area.scrollTop=area.scrollHeight;
}
function render(){renderSidebar();renderTimeline();renderMembers()}
async function refresh(){try{const response=await fetch('/api/state');if(!response.ok)throw Error();data=await response.json();render()}catch{notice('서버에 연결하지 못했습니다.')}}
async function presence(){if(!nick)return;try{await request('/api/presence',{id:clientId,name:nick})}catch{}}
$('homeButton').onclick=()=>{home=true;homeTab='friends';render()};
$('friendsButton').onclick=()=>{home=true;homeTab='friends';render()};
$('updatesButton').onclick=()=>{home=true;homeTab='updates';render()};
$('voicePlaceholder').onclick=()=>notice('음성 채팅은 아직 지원하지 않습니다.');
$('serverMenu').onclick=()=>notice(home?'YEON 홈':currentServer().name+' 서버');
$('membersButton').onclick=()=>{const m=$('memberPane');m.style.display=m.style.display==='none'?'block':'none'};
$('search').oninput=()=>{scrollAfterRender=false;renderTimeline();scrollAfterRender=true};
$('editProfile').onclick=async()=>{const name=await ask('프로필 설정','채팅에 표시할 닉네임을 입력하세요.',nick);if(!name)return;nick=name.slice(0,24);localStorage.setItem('yeon-nickname',nick);render();presence();notice('닉네임을 변경했습니다.')};
$('createServer').onclick=async()=>{const name=await ask('서버 만들기','새 서버의 이름을 입력하세요.');if(!name)return;try{const s=await request('/api/server',{name});serverId=s.id;channelId=s.channels[0].id;home=false;await refresh()}catch(e){notice(e.message)}};
$('createChannel').onclick=async()=>{const name=await ask('텍스트 채널 만들기','채널 이름을 입력하세요.');if(!name)return;try{const c=await request('/api/channel',{serverId,name});channelId=c.id;home=false;await refresh()}catch(e){notice(e.message)}};
$('messageForm').onsubmit=async e=>{e.preventDefault();const input=$('messageInput'),text=input.value.trim();if(!text)return;input.value='';try{await request('/api/message',{serverId,channelId,author:nick,text})}catch(error){input.value=text;notice(error.message)}};
$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('messageForm').requestSubmit()}};
async function start(){if(!nick){nick=await ask('YEON에 오신 것을 환영합니다','채팅에 사용할 닉네임을 정해주세요.');if(!nick)nick='게스트-'+clientId.slice(0,5);localStorage.setItem('yeon-nickname',nick)}await refresh();await presence();
const es=new EventSource('/api/events');es.onopen=()=>{$('connection').textContent='● 연결됨'};es.onerror=()=>{$('connection').textContent='재연결 중…'};
es.addEventListener('message',e=>{const m=JSON.parse(e.data);if(!data.messages.some(x=>x.id===m.id)){data.messages.push(m);if(!home&&m.serverId===serverId&&m.channelId===channelId)renderTimeline()}});
es.addEventListener('state',e=>{const v=JSON.parse(e.data);data=v;render()});es.addEventListener('online',e=>{data.online=JSON.parse(e.data);renderMembers()});setInterval(presence,20000)}
start();
</script></body></html>
