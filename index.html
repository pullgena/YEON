<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YEON Messenger</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Malgun Gothic",sans-serif;background:#202127;color:#f1f2f7}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}button:hover{filter:brightness(1.18)}.hidden{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#5056a1,#161720 65%)}.authbox{width:min(430px,94vw);background:#262833;border-radius:16px;padding:32px;box-shadow:0 16px 60px #0006}.authbox h1{margin:0;color:white}.authbox p{color:#b1b3c8}.authbox input,.authbox button{width:100%;padding:12px;margin:7px 0;border-radius:7px}.authbox input{background:#171820;border:1px solid #555666;color:white}.primary{background:#5865f2;font-weight:700}.secondary{background:#454655}.err{color:#ff9494;font-size:13px}
#app{height:100dvh;display:grid;grid-template-columns:72px 245px minmax(350px,1fr) 220px}.rail{background:#14151c;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto}.bubble{flex:none;width:48px;height:48px;border-radius:18px;background:#383b4b;font-weight:800;font-size:20px}.bubble.on,.bubble:hover{background:#5865f2;border-radius:15px}.bubble.add{background:#253c32;color:#58df98}.side{background:#23242d;display:flex;flex-direction:column;min-height:0}.heading{height:60px;padding:19px 15px;font-weight:800;box-shadow:0 1px 2px #111}.sidecontent{flex:1;overflow:auto;padding:12px 8px}.group{color:#9295a7;font-size:12px;font-weight:800;padding:18px 10px 8px;display:flex;justify-content:space-between}.group button{background:transparent}.nav{display:block;text-align:left;background:transparent;border-radius:7px;width:100%;padding:11px;color:#b7bacb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav.on,.nav:hover{background:#414352;color:#fff}.profile{background:#181920;padding:10px;display:flex;align-items:center;justify-content:space-between;font-size:13px}.profile button{background:#454655;padding:7px;border-radius:6px}
.main{background:#30313b;display:flex;flex-direction:column;min-width:0}.top{height:60px;flex:none;box-shadow:0 1px 2px #1114;padding:20px;font-weight:800}.stream{flex:1;overflow:auto;padding:24px}.msg{display:flex;gap:13px;margin:13px 0;overflow-wrap:anywhere}.avatar{width:40px;height:40px;background:#6666d7;border-radius:50%;flex:none;display:grid;place-items:center}.msg b{font-size:14px}.msg time{font-size:11px;color:#a4a7b7;margin-left:10px}.msg p{font-size:14px;margin:5px 0;white-space:pre-wrap}.intro{margin-top:40px;color:#b5b6c6}.composer{display:flex;gap:8px;margin:12px 22px 25px;background:#414350;padding:10px;border-radius:9px}.composer textarea{background:transparent;color:white;border:0;outline:0;flex:1;resize:none}.composer button{background:#5865f2;border-radius:7px;padding:9px 14px}.members{background:#282932;padding:20px 12px;font-size:13px;color:#b9bbc9}.members h3{font-size:12px}.members div{padding:8px}
dialog{background:#30313c;border:1px solid #555869;color:white;border-radius:13px;padding:25px;width:min(420px,92vw)}dialog::backdrop{background:#000b}dialog input{background:#171820;border:1px solid #555;color:white;padding:11px;width:100%;margin:12px 0}dialog button{padding:10px 15px;border-radius:7px;background:#5865f2}dialog button.cancel{background:#555}#notice{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#14151c;padding:12px;border-radius:9px;display:none}
@media(max-width:900px){#app{grid-template-columns:65px 210px minmax(0,1fr)}.members{display:none}}@media(max-width:610px){#app{grid-template-columns:56px 120px minmax(0,1fr)}.heading{padding:12px;font-size:13px}.stream{padding:10px}.composer{margin:6px}.nav{padding:8px 4px;font-size:12px}}
</style></head><body>
<section id="auth"><div class="authbox"><h1>✦ YEON</h1><p id="authCaption">로그인하거나 새 계정을 만드세요.</p>
<div id="loginStage"><input id="username" placeholder="사용자 이름" autocomplete="username"><input id="password" type="password" placeholder="비밀번호" autocomplete="current-password"><button class="primary" id="login">로그인</button><button class="secondary" id="register">계정 만들기</button></div>
<div id="signupStage" class="hidden"><input id="newName" placeholder="새 사용자 이름 (2~24자)" autocomplete="username"><input id="newEmail" type="email" placeholder="본인 이메일 주소" autocomplete="email"><input id="newPassword" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="new-password"><button class="primary" id="sendCode">이메일 인증번호 받기</button><button class="secondary" id="signupBack">로그인으로 돌아가기</button></div>
<div id="verifyStage" class="hidden"><p id="verifyEmail"></p><input id="emailCode" inputmode="numeric" maxlength="6" placeholder="이메일 인증번호 6자리"><button class="primary" id="verifyCode">인증하고 메인 화면으로</button><button class="secondary" id="verifyBack">이메일 다시 입력</button></div><p id="authError" class="err" role="alert"></p></div></section>
<div id="app" class="hidden"><nav class="rail"><button class="bubble" id="home" title="친구">✦</button><div id="serverIcons" style="display:contents"></div><button class="bubble add" id="addServer" title="서버 만들기">＋</button><button class="bubble add" id="joinServer" title="서버 참가">➜</button></nav>
<aside class="side"><div class="heading" id="serverTitle">홈 · 친구</div><div class="sidecontent" id="sidebar"></div><div class="profile"><b id="me"></b><button id="logout">로그아웃</button></div></aside>
<main class="main"><div class="top" id="roomTitle">친구</div><div class="stream" id="stream"></div><form class="composer" id="form"><textarea id="text" rows="2" maxlength="2000" placeholder="메시지 보내기 (Enter)"></textarea><button type="submit">전송</button></form></main>
<aside class="members"><h3>YEON</h3><div>친구와 서버에 참여해 대화해 보세요.</div><p id="network"></p></aside></div>
<dialog id="dialog"><form id="dialogForm"><h2 id="dialogTitle"></h2><p id="dialogDescription"></p><input id="dialogValue" required><div style="display:flex;justify-content:flex-end;gap:8px"><button class="cancel" type="button" id="cancel">취소</button><button type="submit">확인</button></div></form></dialog><div id="notice"></div>
<script>
const $=id=>document.getElementById(id),base=location.origin;
let token=localStorage.getItem('yeon-token')||'',state=null,serverId=null,room=null,home=true,modalResolve=null,events=null;
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
function notify(message){const x=$('notice');x.textContent=message;x.style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>x.style.display='none',3800)}
async function api(route,body){const r=await fetch(route,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'요청 오류');return data}
function ask(title,description){return new Promise(resolve=>{modalResolve=resolve;$('dialogTitle').textContent=title;$('dialogDescription').textContent=description;$('dialogValue').value='';$('dialog').showModal();$('dialogValue').focus()})}
$('dialogForm').onsubmit=e=>{e.preventDefault();$('dialog').close();modalResolve?.($('dialogValue').value.trim());modalResolve=null};$('cancel').onclick=()=>{$('dialog').close();modalResolve?.(null);modalResolve=null};$('dialog').onclose=()=>{if(modalResolve){modalResolve(null);modalResolve=null}};
function dmRoom(other){return 'dm:'+([state.me.id,other].sort().join(':'))}
function friends(){return state.friends.filter(f=>f.status==='accepted').map(f=>f.from===state.me.id?f.to:f.from)}
function userName(id){return id===state.me.id?state.me.name:(state.users.find(u=>u.id===id)?.name||'사용자')}
function authStage(stage){for(const id of ['loginStage','signupStage','verifyStage'])$(id).classList.toggle('hidden',id!==stage);$('authError').textContent='';$('authCaption').textContent=stage==='loginStage'?'로그인하거나 새 계정을 만드세요.':stage==='signupStage'?'이메일 인증으로 YEON 계정을 만들어 주세요.':'이메일로 받은 6자리 인증번호를 입력하세요.'}
async function doLogin(){try{const result=await api('/api/login',{name:$('username').value.trim(),password:$('password').value});token=result.token;localStorage.setItem('yeon-token',token);await start()}catch(e){$('authError').textContent=e.message}}
$('login').onclick=doLogin;$('password').onkeydown=e=>{if(e.key==='Enter')doLogin()};
$('register').onclick=()=>authStage('signupStage');$('signupBack').onclick=()=>authStage('loginStage');
$('sendCode').onclick=async()=>{const button=$('sendCode');button.disabled=true;try{const email=$('newEmail').value.trim();await api('/api/register/start',{name:$('newName').value.trim(),email,password:$('newPassword').value});$('verifyEmail').textContent=email+' 주소로 전송한 인증번호를 입력해 주세요.';authStage('verifyStage');$('emailCode').focus()}catch(e){$('authError').textContent=e.message}finally{button.disabled=false}};
$('verifyBack').onclick=()=>authStage('signupStage');
$('verifyCode').onclick=async()=>{const button=$('verifyCode');button.disabled=true;try{const result=await api('/api/register/verify',{email:$('newEmail').value.trim(),code:$('emailCode').value.trim()});token=result.token;localStorage.setItem('yeon-token',token);await start()}catch(e){$('authError').textContent=e.message}finally{button.disabled=false}};
$('emailCode').onkeydown=e=>{if(e.key==='Enter')$('verifyCode').click()};
async function reload(){state=await api('/api/state');if(!home&&!state.servers.some(s=>s.id===serverId)){home=true;serverId=null;room=null}render()}
function render(){
 $('me').textContent=state.me.name;$('auth').classList.add('hidden');$('app').classList.remove('hidden');
 $('home').classList.toggle('on',home);$('serverIcons').replaceChildren();
 state.servers.forEach(s=>{let b=node('button',s.name.slice(0,1).toUpperCase(),'bubble'+(!home&&s.id===serverId?' on':''));b.title=s.name;b.onclick=()=>{home=false;serverId=s.id;room=state.channels.find(c=>c.serverId===s.id)?.id||null;render()};$('serverIcons').append(b)});
 $('serverTitle').textContent=home?'홈 · 친구':state.servers.find(s=>s.id===serverId)?.name||'서버';$('sidebar').replaceChildren();
 if(home){const heading=node('div','친구 추가 · 관리','group'),add=node('button','＋');add.onclick=addFriend;heading.append(add);$('sidebar').append(heading);
 const pending=state.friends.filter(f=>f.status==='pending'&&f.to===state.me.id);
 pending.forEach(f=>{let b=node('button','수락: '+userName(f.from),'nav');b.onclick=async()=>{await api('/api/friend/accept',{id:f.id});await reload()};$('sidebar').append(b)});
 friends().forEach(id=>{const b=node('button','◉ '+userName(id),'nav'+(room===dmRoom(id)?' on':''));b.onclick=()=>{room=dmRoom(id);render()};$('sidebar').append(b)});
 if(!friends().length)$('sidebar').append(node('div','친구 추가 버튼을 눌러 친구를 찾아보세요.','intro'));
 }else{const header=node('div','채팅방 추가 · 채널','group'),plus=node('button','＋');plus.onclick=addChannel;header.append(plus);$('sidebar').append(header);
 state.channels.filter(c=>c.serverId===serverId).forEach(c=>{const b=node('button','# '+c.name,'nav'+(room===c.id?' on':''));b.onclick=()=>{room=c.id;render()};$('sidebar').append(b)});
 const s=state.servers.find(s=>s.id===serverId);const code=node('button','초대 코드: '+(s?.invite||''),'nav');code.onclick=()=>{navigator.clipboard?.writeText(s.invite).then(()=>notify('초대 코드를 복사했습니다.')).catch(()=>notify('초대 코드: '+s.invite))};$('sidebar').append(code)}
 draw();
}
function draw(){
 let title='친구를 선택해 대화를 시작하세요.';
 if(room?.startsWith('dm:'))title='@ '+userName(room.slice(3).split(':').find(id=>id!==state.me.id));
 else if(room)title='# '+(state.channels.find(c=>c.id===room)?.name||'채팅');
 $('roomTitle').textContent=title;$('stream').replaceChildren();$('form').style.display=room?'flex':'none';
 if(!room){$('stream').append(node('div','친구를 추가하거나 서버 채널을 선택하세요.','intro'));return}
 const messages=state.messages.filter(m=>m.room===room);
 if(!messages.length)$('stream').append(node('div','아직 메시지가 없습니다. 첫 인사를 보내 보세요!','intro'));
 for(const m of messages){const row=node('div',undefined,'msg'),av=node('span',userName(m.author).charAt(0).toUpperCase(),'avatar'),b=node('div'),head=node('div');head.append(node('b',userName(m.author)),node('time',new Date(m.time).toLocaleString('ko-KR')));b.append(head,node('p',m.text));row.append(av,b);$('stream').append(row)}$('stream').scrollTop=$('stream').scrollHeight;
}
async function addFriend(){const name=await ask('친구 추가','등록된 사용자 이름을 입력하세요.');if(!name)return;try{await api('/api/friend',{name});notify('친구 요청을 보냈습니다.');await reload()}catch(e){notify(e.message)}}
async function addChannel(){const name=await ask('채널 만들기','새 텍스트 채널 이름');if(!name)return;try{const c=await api('/api/channels',{serverId,name});room=c.id;await reload()}catch(e){notify(e.message)}}
$('home').onclick=()=>{home=true;serverId=null;room=null;render()};
$('addServer').onclick=async()=>{const name=await ask('서버 만들기','만들 서버 이름');if(!name)return;try{const result=await api('/api/servers',{name});home=false;serverId=result.server.id;room=result.channel.id;await reload()}catch(e){notify(e.message)}};
$('joinServer').onclick=async()=>{const code=await ask('서버 참가','친구가 알려준 초대 코드');if(!code)return;try{const result=await api('/api/join',{code});home=false;serverId=result.server.id;room=null;await reload();room=state.channels.find(c=>c.serverId===serverId)?.id;render()}catch(e){notify(e.message)}};
$('form').onsubmit=async e=>{e.preventDefault();const input=$('text'),value=input.value.trim();if(!value||!room)return;input.value='';try{const m=await api('/api/messages',{room,text:value});if(!state.messages.some(x=>x.id===m.id)){state.messages.push(m);draw()}}catch(err){input.value=value;notify(err.message)}};
$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};
$('logout').onclick=async()=>{try{await api('/api/logout',{})}catch{}localStorage.removeItem('yeon-token');token='';events?.close();$('app').classList.add('hidden');$('auth').classList.remove('hidden')};
async function start(){try{await reload();events?.close();events=new EventSource('/api/events?token='+encodeURIComponent(token));events.addEventListener('refresh',()=>reload().catch(console.error));events.addEventListener('message',e=>{const m=JSON.parse(e.data);if(!state.messages.some(x=>x.id===m.id)){state.messages.push(m);if(m.room===room)draw()}});events.onopen=()=>{$('network').textContent='● 실시간 연결됨'};events.onerror=()=>{$('network').textContent='연결 재시도 중'}}catch(e){token='';localStorage.removeItem('yeon-token');$('authError').textContent='서버에 연결하거나 로그인할 수 없습니다.'}}
}
if(token)start();
</script></body></html>
